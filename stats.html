<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SlotWake München — waitlist stats</title>
  <meta name="description" content="Public aggregate stats for SlotWake München Bürgerbüro alerts. No personal data." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3efe6;
      --bg-2: #e7e0d2;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #cfc6b6;
      --accent: #0f5c4c;
      --accent-ink: #f7f4ec;
      --card: #faf7f0;
      --max: 36rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #dfece7 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #efe6d4 0%, transparent 50%),
        var(--bg);
      line-height: 1.5;
    }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 1.25rem 1.25rem 4rem; }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; margin-bottom: 2rem; font-size: 0.95rem;
    }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--ink); }
    nav strong { font-family: Fraunces, Georgia, serif; font-weight: 700; }
    .lang { display: flex; gap: 0.35rem; }
    .lang button {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      padding: 0.25rem 0.55rem; border-radius: 999px; cursor: pointer; font: inherit;
    }
    .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      line-height: 1.15; letter-spacing: -0.03em; margin: 0 0 0.5rem;
    }
    .lead { color: var(--muted); margin: 0 0 1.5rem; }
    .grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin: 1.25rem 0;
    }
    .grid div {
      background: var(--card); border: 1px solid var(--line); border-radius: 0.6rem;
      padding: 1rem 0.85rem; text-align: center;
    }
    .grid b {
      display: block; font-family: Fraunces, Georgia, serif; font-size: 2rem; line-height: 1.1;
    }
    .grid span { font-size: 0.82rem; color: var(--muted); }
    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: 0.6rem;
      padding: 1rem 1.1rem; margin-top: 1rem;
    }
    .panel h2 {
      font-family: Fraunces, Georgia, serif; font-size: 1.1rem; margin: 0 0 0.65rem;
    }
    .svc { display: flex; justify-content: space-between; gap: 1rem; padding: 0.35rem 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
    .svc:last-child { border-bottom: 0; }
    .meta { font-size: 0.85rem; color: var(--muted); margin-top: 1.25rem; }
    .err { color: #7a3e12; background: #f6ebe1; border-radius: 0.4rem; padding: 0.75rem 1rem; }
    .cta {
      display: inline-block; margin-top: 1.5rem; background: var(--accent); color: var(--accent-ink);
      text-decoration: none; font-weight: 700; padding: 0.75rem 1.1rem; border-radius: 0.4rem;
    }
    footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <strong><a href="index.html">SlotWake München</a></strong>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="btn-en" aria-pressed="true">EN</button>
        <button type="button" id="btn-de" aria-pressed="false">DE</button>
      </div>
    </nav>

    <header>
      <h1 data-i18n="title">Waitlist stats</h1>
      <p class="lead" data-i18n="lead">Public counts only — no emails or personal data.</p>
    </header>

    <div id="status" class="meta" data-i18n="loading">Loading…</div>

    <div class="grid" id="stats" hidden>
      <div><b id="active">—</b><span data-i18n="active">Active subscribers</span></div>
      <div><b id="total">—</b><span data-i18n="total">Total signups</span></div>
      <div><b id="alerts">—</b><span data-i18n="alerts">Alerts sent</span></div>
      <div><b id="slots">—</b><span data-i18n="slots">Slots seen (last run)</span></div>
    </div>

    <div class="panel" id="services-panel" hidden>
      <h2 data-i18n="byService">By service (active)</h2>
      <div id="services"></div>
    </div>

    <p class="meta" id="updated" hidden></p>

    <a class="cta" href="index.html#waitlist" data-i18n="cta">Join the waitlist</a>

    <footer>
      <p data-i18n="footer">Operator dashboard lite. Updated when the concierge runs on the operator Mac.</p>
    </footer>
  </div>

  <script>
    const copy = {
      en: {
        title: "Waitlist stats",
        lead: "Public counts only — no emails or personal data.",
        loading: "Loading…",
        active: "Active subscribers",
        total: "Total signups",
        alerts: "Alerts sent",
        slots: "Slots seen (last run)",
        byService: "By service (active)",
        updated: "Last updated",
        lastRun: "Last concierge run",
        cta: "Join the waitlist",
        footer: "Operator dashboard lite. Updated when the concierge runs on the operator Mac.",
        err: "Could not load stats.json yet. Run concierge once, then publish stats.",
        none: "No active signups yet.",
        serviceLabels: {
          wohnsitzanmeldung: "Anmeldung (Wohnsitz)",
          "wohnsitzanmeldung-familie": "Anmeldung (family)",
          personalausweis: "ID card",
          reisepass: "Passport",
          meldebescheinigung: "Meldebescheinigung",
          unknown: "Other"
        }
      },
      de: {
        title: "Wartelisten-Statistik",
        lead: "Nur öffentliche Zahlen — keine E-Mails oder personenbezogene Daten.",
        loading: "Lade…",
        active: "Aktive Abonnenten",
        total: "Anmeldungen gesamt",
        alerts: "Alerts versendet",
        slots: "Slots gesehen (letzter Lauf)",
        byService: "Nach Anliegen (aktiv)",
        updated: "Zuletzt aktualisiert",
        lastRun: "Letzter Concierge-Lauf",
        cta: "Auf die Warteliste",
        footer: "Operator-Dashboard lite. Wird aktualisiert, wenn der Concierge auf dem Mac läuft.",
        err: "stats.json noch nicht verfügbar. Concierge einmal starten, dann Stats veröffentlichen.",
        none: "Noch keine aktiven Anmeldungen.",
        serviceLabels: {
          wohnsitzanmeldung: "Anmeldung (Wohnsitz)",
          "wohnsitzanmeldung-familie": "Anmeldung (Familie)",
          personalausweis: "Personalausweis",
          reisepass: "Reisepass",
          meldebescheinigung: "Meldebescheinigung",
          unknown: "Sonstiges"
        }
      }
    };

    let lang = "en";

    function applyLang(next) {
      lang = next;
      document.documentElement.lang = lang;
      const dict = copy[lang];
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (dict[key] != null) el.textContent = dict[key];
      });
      document.getElementById("btn-en").setAttribute("aria-pressed", String(lang === "en"));
      document.getElementById("btn-de").setAttribute("aria-pressed", String(lang === "de"));
      renderServices(window.__stats);
    }

    document.getElementById("btn-en").addEventListener("click", () => applyLang("en"));
    document.getElementById("btn-de").addEventListener("click", () => applyLang("de"));

    function fmt(iso) {
      if (!iso) return "—";
      try {
        return new Date(iso).toLocaleString(lang === "de" ? "de-DE" : "en-GB", {
          dateStyle: "medium", timeStyle: "short", timeZone: "Europe/Berlin"
        });
      } catch { return iso; }
    }

    function renderServices(data) {
      const box = document.getElementById("services");
      const panel = document.getElementById("services-panel");
      if (!data || !data.by_service) {
        panel.hidden = true;
        return;
      }
      const entries = Object.entries(data.by_service).filter(([, n]) => n > 0);
      if (!entries.length) {
        box.innerHTML = `<p class="meta">${copy[lang].none}</p>`;
        panel.hidden = false;
        return;
      }
      const labels = copy[lang].serviceLabels;
      box.innerHTML = entries
        .sort((a, b) => b[1] - a[1])
        .map(([k, n]) => `<div class="svc"><span>${labels[k] || k}</span><strong>${n}</strong></div>`)
        .join("");
      panel.hidden = false;
    }

    async function load() {
      const status = document.getElementById("status");
      try {
        const res = await fetch("stats.json?" + Date.now());
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        window.__stats = data;
        document.getElementById("active").textContent = data.active_subscribers ?? "0";
        document.getElementById("total").textContent = data.total_signups ?? "0";
        document.getElementById("alerts").textContent = data.alerts_sent_total ?? "0";
        document.getElementById("slots").textContent = data.last_slot_count ?? "—";
        document.getElementById("stats").hidden = false;
        renderServices(data);
        const updated = document.getElementById("updated");
        updated.hidden = false;
        updated.textContent = `${copy[lang].updated}: ${fmt(data.updated_at)} · ${copy[lang].lastRun}: ${fmt(data.last_run)}`;
        status.hidden = true;
      } catch {
        status.innerHTML = `<span class="err">${copy[lang].err}</span>`;
      }
    }

    applyLang("en");
    load();
  </script>
</body>
</html>
